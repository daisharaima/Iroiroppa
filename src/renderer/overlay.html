<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: theme:; font-src 'self' data: theme:;" />
  <title>Iroiroppa</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body class="overlay-window">
  <div id="overlay-menu" class="overlay-menu hidden"></div>
  <div id="overlay-confirm" class="overlay-confirm hidden" role="alertdialog" aria-modal="true">
    <div id="overlay-confirm-title" class="overlay-confirm-title"></div>
    <div id="overlay-confirm-message" class="overlay-confirm-message"></div>
    <div id="overlay-confirm-detail" class="overlay-confirm-detail"></div>
    <div class="overlay-confirm-actions">
      <button id="overlay-confirm-cancel" class="overlay-confirm-btn" type="button"></button>
      <button id="overlay-confirm-ok" class="overlay-confirm-btn primary" type="button"></button>
    </div>
  </div>
  <div id="overlay-tooltip" class="overlay-tooltip hidden"></div>
  <div id="overlay-chip"></div>

  <script src="../shared/theme-tokens.js"></script>
<script src="kernel/themes.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
