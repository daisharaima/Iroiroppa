name: CI

on:
  # Every branch: the release line (main) and the dev development branch alike.
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      # The test suite does not launch Electron; skip the ~100 MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
