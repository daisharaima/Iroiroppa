name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The packaging step needs Electron's binary, so unlike the CI workflow
      # this must download it.
      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check the release notes exist
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $notes = "release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes file: $notes" }

      - name: Build the NSIS installer and the portable executable
        run: npm run dist -- --publish never

      - name: Show artifacts
        run: Get-ChildItem dist -File | Select-Object Name, Length

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $artifacts = @(Get-ChildItem dist -Filter *.exe | ForEach-Object { $_.FullName })
          if (-not $artifacts) { throw 'No .exe artifacts were produced.' }
          $notes = "release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes file: $notes" }
          # A tag with a suffix (v0.11.0-beta.1) is a pre-release.
          $ghArgs = @('release', 'create', $env:GITHUB_REF_NAME,
                      '--title', "Iroiroppa $env:GITHUB_REF_NAME", '--notes-file', $notes)
          if ($env:GITHUB_REF_NAME -match '-') { $ghArgs += '--prerelease' }
          $ghArgs += $artifacts
          # Idempotent: re-running a tag build replaces the notes and assets.
          & gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:GITHUB_REF_NAME --notes-file $notes
            gh release upload $env:GITHUB_REF_NAME @artifacts --clobber
          } else {
            & gh @ghArgs
          }
